<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Live Interpreter — Andono Imagine</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Noto+Sans+JP&family=Noto+Sans+SC&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0a0f; --sur:#13131a; --sur2:#1c1c26;
  --b1:rgba(255,255,255,.08); --b2:rgba(255,255,255,.14);
  --tx:#e8e8f0; --mu:#6b6b80;
  --id:#4ade80; --jp:#f472b6; --cn:#fb923c; --bo:#a78bfa;
  --fn:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:var(--fn);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;}

/* LOCK */
.ls{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:18px;padding:24px;transition:opacity .4s;}
.ls.out{opacity:0;pointer-events:none;}
.ls-icon{font-size:44px;opacity:.45;}
.ls-title{font-size:12px;letter-spacing:.15em;color:var(--mu);text-transform:uppercase;}
.ls-inp{width:100%;max-width:280px;background:var(--sur2);border:1px solid var(--b2);border-radius:6px;padding:12px 16px;font-size:16px;font-family:var(--fn);color:var(--tx);outline:none;text-align:center;letter-spacing:.12em;}
.ls-inp:focus{border-color:rgba(255,255,255,.3);}
.ls-btn{width:100%;max-width:280px;padding:12px;border-radius:6px;border:1px solid var(--b2);background:var(--sur2);font-family:var(--fn);font-size:13px;font-weight:500;color:var(--tx);cursor:pointer;letter-spacing:.08em;}
.ls-btn:hover{background:#1e1e2a;}
.ls-err{font-size:12px;color:#f87171;min-height:16px;}

/* APP */
#app{display:none;flex-direction:column;flex:1;min-height:0;}

/* HEADER */
.hdr{padding:11px 18px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;flex-shrink:0;}
.logo{font-size:13px;letter-spacing:.1em;color:var(--mu);}
.logo span{color:var(--tx);font-weight:500;}
.brand{font-size:10px;color:var(--mu);letter-spacing:.06em;}

/* STAT BAR */
.sbar{padding:7px 18px;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:10px;font-size:11px;color:var(--mu);letter-spacing:.05em;flex-shrink:0;flex-wrap:wrap;}
.snum{color:var(--tx);font-weight:500;}
.ncb{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:10px;letter-spacing:.06em;border:1px solid var(--b2);background:var(--sur2);color:var(--mu);transition:all .3s;}
.ncb.on{color:#60a5fa;border-color:rgba(96,165,250,.4);background:rgba(96,165,250,.08);}
.ncd{width:5px;height:5px;border-radius:50%;background:var(--mu);flex-shrink:0;transition:all .3s;}
.ncb.on .ncd{background:#60a5fa;box-shadow:0 0 5px #60a5fa;animation:blink 1.8s infinite;}
.sbtns{margin-left:auto;display:flex;gap:6px;}
.sbtn{background:none;border:1px solid var(--b1);border-radius:4px;color:var(--mu);font-family:var(--fn);font-size:10px;padding:2px 7px;cursor:pointer;letter-spacing:.04em;transition:all .15s;}
.sbtn:hover{color:var(--tx);border-color:var(--b2);}
.sbtn.on{color:var(--id);border-color:rgba(74,222,128,.35);}
.sbtn.dbg-on{color:#0f0;border-color:#0f04;}

/* SECTIONS */
.sec{padding:10px 18px;border-bottom:1px solid var(--b1);flex-shrink:0;}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.rl{font-size:11px;color:var(--mu);letter-spacing:.07em;white-space:nowrap;}

/* CHIPS */
.chip{padding:5px 12px;border-radius:4px;border:1px solid var(--b2);background:transparent;font-family:var(--fn);font-size:12px;color:var(--mu);cursor:pointer;letter-spacing:.05em;transition:all .15s;}
.chip:hover{color:var(--tx);}
.chip.jp{color:var(--jp);border-color:rgba(244,114,182,.4);background:rgba(244,114,182,.08);}
.chip.cn{color:var(--cn);border-color:rgba(251,146,60,.4);background:rgba(251,146,60,.08);}
.chip.bo{color:var(--bo);border-color:rgba(167,139,250,.4);background:rgba(167,139,250,.08);}
.chip.ma{color:var(--id);border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.08);}
.chip.mb{color:var(--bo);border-color:rgba(167,139,250,.4);background:rgba(167,139,250,.08);}

/* SLIDER / SELECT */
.tslider{flex:1;min-width:80px;accent-color:var(--id);cursor:pointer;}
.tval{font-size:13px;font-weight:500;color:var(--id);min-width:48px;text-align:right;}
.spsel{background:var(--sur2);border:1px solid var(--b2);border-radius:4px;color:var(--tx);font-family:var(--fn);font-size:11px;padding:3px 6px;cursor:pointer;}

/* TIMER BAR */
.tbar{padding:10px 18px;border-bottom:1px solid var(--b1);flex-shrink:0;}
.ttrack{flex:1;height:4px;background:var(--sur2);border-radius:2px;overflow:hidden;min-width:60px;}
.tfill{height:100%;background:var(--id);transition:width .1s linear;}
.tlang{font-size:12px;font-weight:500;min-width:56px;text-align:right;}
.tsecs{font-size:11px;color:var(--mu);min-width:24px;text-align:right;}

/* TAP PANEL */
.tappanel{display:flex;gap:10px;padding:10px 18px;border-bottom:1px solid var(--b1);flex-shrink:0;}
.tapbtn{flex:1;padding:16px 8px;border-radius:8px;border:1px solid var(--b2);background:var(--sur2);font-family:var(--fn);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .2s;color:var(--mu);user-select:none;-webkit-user-select:none;}
.tapflag{font-size:30px;}
.taplbl{font-size:12px;letter-spacing:.08em;font-weight:500;}
.tapst{font-size:11px;min-height:15px;opacity:.75;}
.tapbtn.lid{border-color:rgba(74,222,128,.6);background:rgba(74,222,128,.1);color:var(--id);animation:ps 1.4s infinite;}
.tapbtn.ljp{border-color:rgba(244,114,182,.6);background:rgba(244,114,182,.1);color:var(--jp);animation:ps 1.4s infinite;}
.tapbtn.lcn{border-color:rgba(251,146,60,.6);background:rgba(251,146,60,.1);color:var(--cn);animation:ps 1.4s infinite;}
@keyframes ps{0%,100%{opacity:1}50%{opacity:.7}}

/* LIVE BOX */
.lbox{padding:14px 18px;border-bottom:1px solid var(--b1);min-height:80px;background:var(--sur);display:flex;flex-direction:column;justify-content:center;gap:5px;flex-shrink:0;transition:background .3s;}
.lbox.act{background:rgba(74,222,128,.04);}
.llbl{font-size:10px;color:var(--mu);letter-spacing:.1em;display:flex;align-items:center;gap:6px;}
.ltxt{font-size:20px;color:var(--tx);line-height:1.4;font-family:'Noto Sans JP','Noto Sans SC',var(--fn);min-height:28px;word-break:break-word;}
.ltxt.emp{color:var(--mu);font-style:italic;font-size:13px;}
.ltxt.par{color:#fbbf24;}
.ltxt.fin{color:var(--id);}

/* STATUS BAR */
.stbar{padding:10px 18px;border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:10px;flex-shrink:0;}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mu);flex-shrink:0;transition:all .3s;}
.dot.lis{background:var(--id);box-shadow:0 0 8px var(--id);animation:blink 1.4s infinite;}
.dot.pro{background:var(--bo);box-shadow:0 0 8px var(--bo);}
.dot.spk{background:#60a5fa;box-shadow:0 0 8px #60a5fa;animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.stxt{font-size:12px;color:var(--mu);letter-spacing:.04em;flex:1;}
.vu{display:flex;gap:3px;align-items:flex-end;height:20px;}
.vb{width:4px;border-radius:2px;background:var(--b2);height:3px;transition:height .08s,background .15s;}
.vb.on{background:var(--id);}

/* CONTROLS */
.ctrl{padding:12px 18px;display:flex;gap:10px;border-bottom:1px solid var(--b1);flex-shrink:0;}
.bmain{flex:1;padding:12px 16px;border-radius:6px;border:1px solid var(--b2);background:var(--sur2);font-family:var(--fn);font-size:13px;font-weight:500;color:var(--tx);cursor:pointer;letter-spacing:.07em;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s;}
.bmain:hover{background:#1e1e2a;}
.bmain.run{border-color:rgba(244,114,102,.5);color:#f47266;background:rgba(244,114,102,.08);}
.bsm{padding:12px 13px;border-radius:6px;border:1px solid var(--b1);background:transparent;color:var(--mu);cursor:pointer;font-size:15px;transition:all .15s;}
.bsm:hover{color:var(--tx);border-color:var(--b2);}
.bsm.on{color:var(--id);border-color:rgba(74,222,128,.4);}

/* LOG */
.log{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:10px;min-height:0;}
.log::-webkit-scrollbar{width:4px;}
.log::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px;}
.emp-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mu);text-align:center;gap:12px;padding:2rem 0;}
.emp-icon{font-size:36px;opacity:.35;}
.emp-txt{font-size:12px;letter-spacing:.04em;line-height:1.9;}
.msg{padding:12px 14px;border-radius:6px;background:var(--sur);border:1px solid var(--b1);animation:fi .2s ease;}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.msg.sid{border-left:3px solid var(--id);}
.msg.sjp{border-left:3px solid var(--jp);}
.msg.scn{border-left:3px solid var(--cn);}
.mmeta{font-size:10px;color:var(--mu);letter-spacing:.07em;text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:8px;}
.mtime{margin-left:auto;opacity:.55;}
.morig{font-size:13px;color:var(--mu);margin-bottom:6px;font-style:italic;}
.mtrans{font-size:16px;line-height:1.5;font-family:'Noto Sans JP','Noto Sans SC',var(--fn);}
.mdiv{border:none;border-top:1px solid var(--b1);margin:7px 0;}
.badge{font-size:10px;padding:2px 7px;border-radius:3px;letter-spacing:.05em;}
.bid{background:rgba(74,222,128,.1);color:var(--id);border:1px solid rgba(74,222,128,.3);}
.bjp{background:rgba(244,114,182,.1);color:var(--jp);border:1px solid rgba(244,114,182,.3);}
.bcn{background:rgba(251,146,60,.1);color:var(--cn);border:1px solid rgba(251,146,60,.3);}

/* TOAST */
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:8888;pointer-events:none;align-items:center;}
.toast{background:var(--sur2);border:1px solid var(--b2);border-radius:8px;padding:9px 16px;font-size:12px;color:var(--tx);letter-spacing:.04em;animation:ti .25s ease;white-space:nowrap;max-width:90vw;text-align:center;}
.toast.err{border-color:rgba(248,113,113,.4);color:#f87171;background:rgba(248,113,113,.08);}
.toast.ok{border-color:rgba(74,222,128,.4);color:var(--id);background:rgba(74,222,128,.08);}
.toast.warn{border-color:rgba(251,191,36,.4);color:#fbbf24;background:rgba(251,191,36,.08);}
@keyframes ti{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* DEBUG */
.dbgp{background:#000;color:#0f0;font-family:monospace;font-size:10px;padding:8px 12px;max-height:130px;overflow-y:auto;border-top:1px solid #0f04;display:none;flex-shrink:0;}
.dbgp.on{display:block;}
.dl{margin:1px 0;white-space:pre-wrap;word-break:break-all;}
.de{color:#f87171;}.dok{color:#4ade80;}.dw{color:#fbbf24;}

/* LANDSCAPE */
@media (orientation:landscape) and (max-height:500px) {
  .lbox{min-height:56px;padding:8px 18px;}
  .ltxt{font-size:16px;}
  .tapbtn{padding:10px 8px;}
  .tapflag{font-size:22px;}
  .sec,.tbar,.tappanel{padding-top:7px;padding-bottom:7px;}
  .hdr{padding-top:7px;padding-bottom:7px;}
}

/* MOBILE */
@media (max-width:480px) {
  .hdr,.sbar,.sec,.stbar,.ctrl,.lbox,.tbar,.tappanel,.dbgp{padding-left:14px;padding-right:14px;}
  .log{padding:12px 14px;}
  .ltxt{font-size:18px;}
}
</style>
</head>
<body>

<!-- LOCK SCREEN -->
<div class="ls" id="lock-screen">
  <div class="ls-icon">🔒</div>
  <div class="ls-title">Live Interpreter &middot; Private</div>
  <input type="password" class="ls-inp" id="lock-input"
    placeholder="Password" autocomplete="off"
    onkeydown="if(event.key==='Enter')checkPass()">
  <button class="ls-btn" onclick="checkPass()">MASUK</button>
  <div class="ls-err" id="lock-err"></div>
</div>

<!-- MAIN APP -->
<div id="app">

  <div class="hdr">
    <div class="logo"><span>LIVE</span> INTERPRETER &middot; ID &middot; JP &middot; CN</div>
    <div class="brand">Andono Imagine &mdash; 2026</div>
  </div>

  <div class="sbar">
    <span>KALIMAT:</span><span class="snum" id="stat-sentences">0</span>
    <span>&middot;</span>
    <span>SESI:</span><span class="snum" id="stat-session">00:00</span>
    <span class="ncb" id="nc-badge"><span class="ncd"></span><span id="nc-txt">NC</span></span>
    <div class="sbtns">
      <button class="sbtn" id="wl-btn" title="Wake Lock — cegah layar mati" onclick="toggleWakeLock()">&#x1F506;</button>
      <button class="sbtn" onclick="exportTranscript()" title="Export transcript">&#x1F4BE;</button>
      <button class="sbtn" onclick="resetStats()" title="Reset statistik">&#x21BA;</button>
      <button class="sbtn" id="dbg-btn" onclick="toggleDebug()">&#x1F41B;</button>
    </div>
  </div>

  <!-- Bahasa -->
  <div class="sec">
    <div class="row">
      <span class="rl">BAHASA</span>
      <button class="chip jp" id="lang-jp" onclick="setLang('jp')">&#x1F1EE;&#x1F1E9;&#x21D4;&#x1F1EF;&#x1F1F5; JEPANG</button>
      <button class="chip" id="lang-cn" onclick="setLang('cn')">&#x1F1EE;&#x1F1E9;&#x21D4;&#x1F1E8;&#x1F1F3; MANDARIN</button>
      <button class="chip" id="lang-both" onclick="setLang('both')">&#x1F1EF;&#x1F1F5;&#x1F1E8;&#x1F1F3; KEDUANYA</button>
    </div>
  </div>

  <!-- Input mode + TTS speed -->
  <div class="sec">
    <div class="row">
      <span class="rl">MODE</span>
      <button class="chip ma" id="im-a" onclick="setInputMode('a')">&#x23F1; A &middot; AUTO</button>
      <button class="chip" id="im-b" onclick="setInputMode('b')">&#x1F446; B &middot; TAP</button>
      <span class="rl" style="margin-left:6px">TTS</span>
      <select class="spsel" id="tts-speed" onchange="updateTTSSpeed(this.value)">
        <option value="0.7">Lambat</option>
        <option value="0.9" selected>Normal</option>
        <option value="1.1">Cepat</option>
        <option value="1.3">Sangat Cepat</option>
      </select>
    </div>
  </div>

  <!-- Timer setting (Mode A) -->
  <div class="sec" id="timer-setting">
    <div class="row">
      <span class="rl">DURASI/SISI</span>
      <input type="range" class="tslider" id="timer-slider"
        min="3" max="30" value="5" step="1"
        oninput="updateTimerDuration(this.value)">
      <span class="tval" id="timer-val">5 dtk</span>
    </div>
  </div>

  <!-- Timer bar (Mode A running) -->
  <div class="tbar" id="timer-bar" style="display:none">
    <div class="row">
      <span class="rl">AKTIF</span>
      <div class="ttrack"><div class="tfill" id="timer-fill"></div></div>
      <span class="tlang" id="timer-lang">&#x1F1EE;&#x1F1E9; ID</span>
      <span class="tsecs" id="timer-secs">5s</span>
    </div>
  </div>

  <!-- Tap panel (Mode B running) -->
  <div class="tappanel" id="tap-panel" style="display:none">
    <button class="tapbtn" id="tap-id" onclick="tap('id')">
      <span class="tapflag">&#x1F1EE;&#x1F1E9;</span>
      <span class="taplbl">INDONESIA</span>
      <span class="tapst" id="tap-id-st">Tap untuk giliran</span>
    </button>
    <button class="tapbtn" id="tap-foreign" onclick="tap('foreign')">
      <span class="tapflag" id="tap-f-flag">&#x1F1EF;&#x1F1F5;</span>
      <span class="taplbl" id="tap-f-lbl">JEPANG</span>
      <span class="tapst" id="tap-f-st">Tap untuk giliran</span>
    </button>
  </div>

  <!-- Live transcript -->
  <div class="lbox" id="live-box">
    <div class="llbl"><span>&#x1F3A4;</span><span id="live-lbl">YANG TERDENGAR</span></div>
    <div class="ltxt emp" id="live-txt">Tekan START untuk mulai...</div>
  </div>

  <!-- Status + VU -->
  <div class="stbar">
    <div class="dot" id="dot"></div>
    <span class="stxt" id="status-txt">Siap digunakan</span>
    <div class="vu">
      <div class="vb" id="vu1"></div><div class="vb" id="vu2"></div>
      <div class="vb" id="vu3"></div><div class="vb" id="vu4"></div>
      <div class="vb" id="vu5"></div><div class="vb" id="vu6"></div>
      <div class="vb" id="vu7"></div>
    </div>
  </div>

  <div class="ctrl">
    <button class="bmain" id="btn-main" onclick="toggleRun()">
      <span id="btn-icon">&#x25B6;</span>
      <span id="btn-lbl">START INTERPRETER</span>
    </button>
    <button class="bsm" id="btn-mute" onclick="toggleMute()" title="Mute speaker">&#x1F50A;</button>
    <button class="bsm" onclick="clearLog()" title="Hapus log">&#x1F5D1;</button>
  </div>

  <div class="log" id="log">
    <div class="emp-state" id="empty-state">
      <div class="emp-icon">&#x1F3A4;</div>
      <div class="emp-txt">Mode A: timer bergantian otomatis<br>Mode B: tap untuk pilih giliran</div>
    </div>
  </div>

  <div class="dbgp" id="dbg-panel"></div>
</div>

<div class="toasts" id="toasts"></div>

<script>
'use strict';

// -- PLATFORM ----------------------------------------------
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var IS_ANDROID = /Android/i.test(navigator.userAgent);
var IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
var IS_MOBILE = IS_ANDROID || IS_IOS;

// -- PASSWORD ----------------------------------------------
function simpleHash(s) {
  var h = 0;
  for (var i = 0; i < s.length; i++) {
    h = Math.imul(31, h) + s.charCodeAt(i) | 0;
  }
  return h.toString(36);
}
var CORRECT_HASH = simpleHash('andono2026');

function checkPass() {
  var val = ge('lock-input').value;
  if (simpleHash(val) === CORRECT_HASH) {
    var ls = ge('lock-screen');
    ls.classList.add('out');
    setTimeout(function() {
      ls.style.display = 'none';
      var app = ge('app');
      app.style.display = 'flex';
      sessionStorage.setItem('auth', '1');
      init();
    }, 400);
  } else {
    var err = ge('lock-err');
    err.textContent = 'Password salah';
    ge('lock-input').value = '';
    ge('lock-input').focus();
    setTimeout(function() { err.textContent = ''; }, 2000);
  }
}

// Auto-unlock
if (sessionStorage.getItem('auth') === '1') {
  ge_ready(function() {
    ge('lock-screen').style.display = 'none';
    ge('app').style.display = 'flex';
    init();
  });
}

function ge_ready(fn) {
  if (document.readyState !== 'loading') fn();
  else document.addEventListener('DOMContentLoaded', fn);
}

// -- STATE -------------------------------------------------
var S = {
  running: false,
  speaking: false,
  lang: 'jp',
  mode: 'a',
  timerMs: 5000,
  ttsRate: 0.9,
  tapSide: null,
  cycleSide: 'id',
  muted: false,
  sentences: 0,
  sessionStart: null,
  wakeLock: null
};

var transcript = [];

// Recognition
var recInst = null;
var recBusy = false;

// Buffers
var pending = '';
var pendingTmr = null;
var lastFinal = '';
var lastFinalTime = 0;
var silenceTmr = null;
var lastPartial = '';

// Audio
var audioStream = null;
var audioCtx = null;
var vuRAF = null;
var avuInt = null;
var silentCtx = null;

// VAD
var vadOn = false;
var vadSilStart = 0;
var VAD_THR = 15;
var VAD_SIL = 1200;

// Timers
var timerInt = null;
var timerRem = 5000;
var sessInt = null;

// Debug
var debugOn = false;

// -- HELPERS -----------------------------------------------
function ge(id) { return document.getElementById(id); }

function escHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function ge_safe(id) {
  var el = ge(id);
  return el || { textContent:'', className:'', style:{}, classList:{ add:function(){}, remove:function(){}, toggle:function(){}, contains:function(){return false;} } };
}

// -- DEBUG -------------------------------------------------
function dbg(msg, type) {
  if (!debugOn) return;
  var p = ge('dbg-panel');
  if (!p) return;
  var d = document.createElement('div');
  d.className = 'dl' + (type === 'err' ? ' de' : type === 'ok' ? ' dok' : type === 'warn' ? ' dw' : '');
  var t = new Date().toLocaleTimeString('id-ID', {minute:'2-digit', second:'2-digit'});
  d.textContent = t + ' ' + String(msg);
  p.appendChild(d);
  while (p.children.length > 80) p.removeChild(p.firstChild);
  p.scrollTop = p.scrollHeight;
}

function toggleDebug() {
  debugOn = !debugOn;
  var p = ge('dbg-panel');
  var b = ge('dbg-btn');
  if (debugOn) {
    p.classList.add('on');
    b.classList.add('dbg-on');
    dbg('DEBUG ON / Android:' + IS_ANDROID + ' / SR:' + !!SR, 'ok');
  } else {
    p.classList.remove('on');
    b.classList.remove('dbg-on');
  }
}

// -- TOAST -------------------------------------------------
function toast(msg, type, ms) {
  var c = ge('toasts');
  if (!c) return;
  var t = document.createElement('div');
  t.className = 'toast' + (type ? ' ' + type : '');
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(function() {
    t.style.transition = 'opacity .3s';
    t.style.opacity = '0';
    setTimeout(function() { if (c.contains(t)) c.removeChild(t); }, 300);
  }, ms || 2500);
}

// -- WAKE LOCK ---------------------------------------------
async function requestWakeLock() {
  if (!('wakeLock' in navigator)) { dbg('WakeLock not supported', 'warn'); return; }
  try {
    S.wakeLock = await navigator.wakeLock.request('screen');
    ge('wl-btn').classList.add('on');
    dbg('WakeLock OK', 'ok');
    S.wakeLock.addEventListener('release', function() {
      S.wakeLock = null;
      ge('wl-btn').classList.remove('on');
    });
    document.addEventListener('visibilitychange', async function() {
      if (document.visibilityState === 'visible' && S.running && !S.wakeLock) {
        await requestWakeLock();
      }
    });
  } catch(e) { dbg('WakeLock err: ' + e.message, 'err'); }
}

function releaseWakeLock() {
  if (S.wakeLock) { S.wakeLock.release(); S.wakeLock = null; }
  ge('wl-btn').classList.remove('on');
}

function toggleWakeLock() {
  if (S.wakeLock) {
    releaseWakeLock();
    toast('Wake Lock dimatikan', 'warn', 1500);
  } else {
    requestWakeLock().then(function() {
      if (S.wakeLock) toast('Layar tidak akan mati', 'ok', 2000);
      else toast('Wake Lock tidak didukung di browser ini', 'warn');
    });
  }
}

// -- LANGUAGE HELPERS --------------------------------------
function foreignLang() {
  return S.lang === 'cn' ? 'zh-CN' : 'ja-JP';
}

function langCode(side) {
  return side === 'id' ? 'id-ID' : foreignLang();
}

function detectSrcLang(text) {
  var kana = (text.match(/[\u3040-\u30ff]/g) || []).length;
  var cjk  = (text.match(/[\u4e00-\u9fff]/g) || []).length;
  var lat  = (text.match(/[a-zA-Z]/g) || []).length;
  if (kana >= 1) return 'jp';
  if (cjk >= 2 && cjk > lat) return 'cn';
  return 'id';
}

// -- RUN / STOP --------------------------------------------
function toggleRun() {
  if (S.running) stopRun(); else startRun();

function startRun() {
  if (!SR) { toast('Browser tidak mendukung Web Speech API', 'err'); return; }
  S.running = true;
  var bm = ge('btn-main');
  if (bm) bm.classList.add('run');

}

function stopRun() {
  S.running = false;
  S.tapSide = null;
  S.speaking = false;
  stopRecognition();
  clearTimerA();
  stopSessionTimer();
  cleanupAudio();
  clearTimeout(pendingTmr);
  clearTimeout(silenceTmr);
  pending = '';
  lastPartial = '';
  var bm = ge('btn-main');
  if (bm) bm.classList.remove('run');
  var bi = ge('btn-icon'); var bl = ge('btn-lbl');
  if (bi) bi.textContent = '▶';
  if (bl) bl.textContent = 'START INTERPRETER';
  setStatus('', 'Interpreter dihentikan');
  setLiveText('', 'emp');
  var tb = ge('timer-bar'); var tp = ge('tap-panel');
  if (tb) tb.style.display = 'none';
  if (tp) tp.style.display = 'none';
  resetVUBars();
  updateNCBadge(false);
  toast('Interpreter dihentikan', '', 1500);
}

function restartFromConfig() {
  stopRecognition();
  clearTimerA();
  clearTimeout(pendingTmr);
  clearTimeout(silenceTmr);
  pending = '';
  lastPartial = '';
  setLiveText('', 'emp');
  var tb = ge('timer-bar'); var tp = ge('tap-panel');
  if (S.mode === 'a') {
    S.cycleSide = 'id';
    if (tb) tb.style.display = 'block';
    if (tp) tp.style.display = 'none';
    setTimeout(function() { if (S.running) beginCycleA('id'); }, 250);
  } else {
    S.tapSide = 'id';
    if (tb) tb.style.display = 'none';
    if (tp) tp.style.display = 'flex';
    updateTapUI();
    setLiveLabel('id');
    setTimeout(function() { if (S.running) startRecognition(langCode('id')); }, 250);
  }
}

// -- MODE A ------------------------------------------------
function beginCycleA(side) {
  if (!S.running) return;
  S.cycleSide = side;
  setLiveLabel(side);
  setLiveText('Mendengarkan...', 'emp');
  startRecognition(langCode(side));
  startTimerA();
}

function startTimerA() {
  clearTimerA();
  timerRem = S.timerMs;
  updateTimerUI();
  timerInt = setInterval(function() {
    timerRem -= 100;
    updateTimerUI();
    if (timerRem <= 0) {
      clearTimerA();
      if (!S.running || S.speaking) return;
      var next = S.cycleSide === 'id' ? 'foreign' : 'id';
      stopRecognition();
      clearTimeout(pendingTmr); clearTimeout(silenceTmr);
      pending = ''; lastPartial = '';
      setTimeout(function() { if (S.running && !S.speaking) beginCycleA(next); }, 250);
    }
  }, 100);
}

function clearTimerA() {
  clearInterval(timerInt);
  timerInt = null;
}

function updateTimerUI() {
  var pct = (timerRem / S.timerMs) * 100;
  var f = ge('timer-fill');
  if (f) { f.style.width = pct + '%'; f.style.background = pct > 50 ? '#4ade80' : pct > 20 ? '#fbbf24' : '#f87171'; }
  var l = ge('timer-lang');
  if (l) l.textContent = S.cycleSide === 'id' ? '🇮🇩 ID' : (S.lang === 'cn' ? '🇨🇳 CN' : '🇯🇵 JP');
  var sc = ge('timer-secs');
  if (sc) sc.textContent = Math.ceil(timerRem / 1000) + 's';
}

// -- MODE B ------------------------------------------------
function tap(side) {
  if (!S.running || S.speaking) return;
  if (S.tapSide === side) return;
  S.tapSide = side;
  updateTapUI();
  stopRecognition();
  setLiveLabel(side);
  setLiveText('Mendengarkan...', 'emp');
  setTimeout(function() {
    if (S.running && S.tapSide === side) startRecognition(langCode(side));

}

function updateTapUI() {

// -- RECOGNITION -------------------------------------------
async function startRecognition(lang) {
  if (!SR || !S.running || recBusy) return;
  recBusy = true;
  stopRecognitionOnly();

  // Setup audio (desktop only - mobile conflicts with SR)
  if (!IS_MOBILE) {
    try {
      if (audioStream) { audioStream.getTracks().forEach(function(t) { t.stop(); }); audioStream = null; }
      audioStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 }
      });
      var track = audioStream.getAudioTracks()[0];
      var settings = track.getSettings ? track.getSettings() : {};
      updateNCBadge(true, settings);
      setupVUMeter(audioStream);
      dbg('mic OK', 'ok');
    } catch(e) {
      dbg('mic err: ' + e.message, 'err');
      updateNCBadge(false);
    }
  } else {
    updateNCBadge(true, { noiseSuppression: true, echoCancellation: true, autoGainControl: true });
    if (IS_ANDROID) startAndroidVU();
  }

  var r = new SR();
  // Android: continuous:true agar tidak restart terus (penyebab bip)
  // Final result dipaksa via silence detection & manual stop
  r.continuous = true;
  r.interimResults = true;
  r.lang = lang;
  r.maxAlternatives = 1;

  var lbl = lang === 'id-ID' ? 'Mendengarkan (ID)...' : lang === 'ja-JP' ? 'Mendengarkan (JP)...' : 'Mendengarkan (CN)...';

  r.onstart = function() {
    recBusy = false;
    setStatus('lis', lbl);
    dbg('rec.start ' + lang);
    if (IS_ANDROID) startAndroidVU();
  };

  r.onsoundstart = function() {
    dbg('soundstart', 'ok');
    setLiveText('🎙 Suara terdeteksi...', 'par');
  };

  r.onspeechstart = function() {
    dbg('speechstart', 'ok');
    setLiveText('🎙 Bicara terdeteksi...', 'par');
  };

  r.onspeechend = function() {
    dbg('speechend', 'warn');
    // Desktop: stop agar dapat final result
    // Android: JANGAN stop - biarkan continuous berjalan agar tidak restart (mengurangi bip)
    if (!IS_ANDROID && IS_MOBILE) { try { r.stop(); } catch(x) {} }
  };

  r.onresult = function(e) {
    if (S.speaking) return;
    for (var i = e.resultIndex; i < e.results.length; i++) {
      var txt = e.results[i][0].transcript.trim();
      var isFinal = e.results[i].isFinal;

      if (!isFinal) {
        if (!txt) continue;
        // Tampilkan partial di live box
        setLiveText(txt, 'par');
        dbg('partial: ' + txt.substring(0, 40));
        if (txt !== lastPartial) {
          lastPartial = txt;
          clearTimeout(silenceTmr);
          // Android: silence 1.5 detik, Desktop: 2 detik
          var silMs = IS_ANDROID ? 1500 : 2000;
          silenceTmr = setTimeout(function() {
            if (lastPartial && lastPartial.length >= 2 && !S.speaking) {
              dbg('silence-force: ' + lastPartial, 'warn');
              var t = lastPartial; lastPartial = '';
              setLiveText(t, 'fin');
              pending = t;
              clearTimeout(pendingTmr);
              triggerFinal();
            }
          }, silMs);
        }
        continue;
      }

      // Final result
      if (txt.length < 2) continue;
      dbg('api-final: ' + txt.substring(0, 40), 'ok');
      setLiveText(txt, 'fin');
      clearTimeout(silenceTmr);
      lastPartial = '';
      if (txt.length > pending.length) pending = txt;
      clearTimeout(pendingTmr);
      pendingTmr = setTimeout(function() { triggerFinal(); }, 300);
    }
  };

  r.onerror = function(e) {
    recBusy = false;
    dbg('rec err: ' + e.error, (e.error === 'no-speech' || e.error === 'aborted') ? '' : 'err');
    if (e.error === 'not-allowed') {
      toast('Izin mikrofon ditolak — aktifkan di pengaturan', 'err', 5000);
      stopRun(); return;
    }
    if (e.error === 'network') toast('Koneksi bermasalah', 'warn');
    if (e.error === 'no-speech' || e.error === 'aborted') {
      if (!S.running || S.speaking) return;
      restartSame(lang); return;
    }
    setTimeout(function() { if (S.running && !S.speaking) startRecognition(lang); }, 800);
  };

  r.onend = function() {
    recBusy = false;
    dbg('onend partial="' + (lastPartial || 'none') + '"');
    if (!S.running || S.speaking) return;
    // Process pending partial jika ada
    if (lastPartial && lastPartial.length >= 2) {
      dbg('onend force-final: ' + lastPartial, 'warn');
      var t = lastPartial; lastPartial = '';
      clearTimeout(silenceTmr);
      setLiveText(t, 'fin');
      pending = t;
      clearTimeout(pendingTmr);
      triggerFinal();
    }
    // Android: restart cepat karena continuous:true jarang end sendiri
    // (biasanya end karena kita stop() saat ganti bahasa/speaker)
    restartSame(lang);
  };

  recInst = r;
  try { r.start(); } catch(x) { recBusy = false; dbg('start err: ' + x.message, 'err'); }
}

function restartSame(lang) {
  if (!S.running || S.speaking) return;
  // Android: continuous:true jadi jarang restart, delay pendek saja
  // Desktop: 200ms
  var delay = IS_ANDROID ? 200 : 200;
  setTimeout(function() {
    if (!S.running || S.speaking) return;
    if (S.mode === 'a' && timerInt) startRecognition(lang);
    else if (S.mode === 'b' && S.tapSide && langCode(S.tapSide) === lang) startRecognition(lang);
  }, delay);
}

function stopRecognitionOnly() {
  if (recInst) {
    try {
      recInst.onend = null; recInst.onerror = null; recInst.onresult = null;
      recInst.onspeechend = null; recInst.onsoundstart = null; recInst.onspeechstart = null;
      recInst.stop();
    } catch(x) {}
    recInst = null;
  }
  recBusy = false;
}

function stopRecognition() {
  stopRecognitionOnly();
  stopAndroidVU();
}

// -- TRIGGER FINAL -----------------------------------------
function triggerFinal() {
  var final = pending; pending = '';
  if (!final || final.length < 2) return;
  var now = Date.now();
  if (final === lastFinal && now - lastFinalTime < 3000) {
    dbg('dup: ' + final); return;
  }
  lastFinal = final;
  lastFinalTime = now;
  dbg('FINAL: ' + final, 'ok');
  handleFinal(final);
}

// -- TRANSLATION -------------------------------------------
async function translateText(text, from, to) {
  var url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=' + from + '&tl=' + to + '&dt=t&q=' + encodeURIComponent(text);
  var res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  var data = await res.json();
  if (!data || !data[0]) throw new Error('Empty response');
  return data[0].filter(function(x) { return x && x[0]; }).map(function(x) { return x[0]; }).join('');
}

async function handleFinal(text) {
  if (!text || text.length < 2) return;
  setStatus('pro', 'Menerjemahkan...');
  dbg('translate: ' + text.substring(0, 50));
  var src = detectSrcLang(text);
  dbg('src lang: ' + src);
  try {
    var result;
    if (src === 'id') {
      if (S.lang === 'both') {
        var res = await Promise.all([translateText(text, 'id', 'ja'), translateText(text, 'id', 'zh-CN')]);
        result = { dir: 'id-both', jp: res[0], cn: res[1] };
        addMessage(text, result, 'id');
        if (!S.muted) queueSpeech(res[0], 'ja-JP');
      } else {
        var to = S.lang === 'cn' ? 'zh-CN' : 'ja';
        var tl = await translateText(text, 'id', to);
        result = { dir: S.lang === 'cn' ? 'id-cn' : 'id-jp', translated: tl };
        addMessage(text, result, 'id');
        if (!S.muted) queueSpeech(tl, S.lang === 'cn' ? 'zh-CN' : 'ja-JP');
      }
    } else {
      var from = src === 'jp' ? 'ja' : 'zh-CN';
      var tl2 = await translateText(text, from, 'id');
      result = { dir: src + '-id', translated: tl2 };
      addMessage(text, result, src);
      if (!S.muted) queueSpeech(tl2, 'id-ID');
    }
    S.sentences++;
    localStorage.setItem('icount', String(S.sentences));
    updateStats();
    dbg('translate OK', 'ok');
  } catch(e) {
    dbg('translate FAIL: ' + e.message, 'err');
    setStatus('lis', 'Gagal menerjemahkan');
    if (!navigator.onLine) toast('Tidak ada koneksi internet', 'err');
    else toast('Gagal menerjemahkan, coba lagi', 'warn', 2000);
  }
}

// -- SPEECH OUTPUT -----------------------------------------
var speechQ = [];

function queueSpeech(text, lang) {
  speechQ.push({ text: text, lang: lang });
  if (!S.speaking) processSpeech();
}

function processSpeech() {
  if (!speechQ.length) {
    S.speaking = false;
    if (!S.running) return;
    setStatus('lis', 'Mendengarkan...');
    setTimeout(function() {
      if (!S.running) return;
      if (S.mode === 'a') {
        if (timerInt) startRecognition(langCode(S.cycleSide));
        else beginCycleA(S.cycleSide);
      } else if (S.tapSide) {
        startRecognition(langCode(S.tapSide));
      }
    }, 350);
    return;
  }
  S.speaking = true;
  stopRecognitionOnly();
  clearTimerA();
  var item = speechQ.shift();
  setStatus('spk', 'Memutar terjemahan...');
  var u = new SpeechSynthesisUtterance(item.text);
  u.lang = item.lang;
  u.rate = S.ttsRate;
  u.onend = function() { setTimeout(processSpeech, 350); };
  u.onerror = function() { setTimeout(processSpeech, 350); };
  window.speechSynthesis.speak(u);
}

// -- MESSAGE LOG -------------------------------------------
function buildMsgHtml(original, parsed, srcLang, timeStr, isHistory) {
  var badge = srcLang === 'id' ? '<span class="badge bid">KAMU &middot; ID</span>' :
              srcLang === 'jp' ? '<span class="badge bjp">LAWAN &middot; JP</span>' :
                                 '<span class="badge bcn">LAWAN &middot; CN</span>';
  var tlbl = isHistory ? (timeStr + ' (history)') : timeStr;
  var body = '<div class="mmeta">' + badge + '<span class="mtime">' + tlbl + '</span></div>' +
             '<div class="morig">&ldquo;' + escHtml(original) + '&rdquo;</div>';
  if (parsed.dir === 'id-both') {
    body += '<div class="mtrans">&#x1F1EF;&#x1F1F5; ' + escHtml(parsed.jp) + '</div>' +
            '<hr class="mdiv">' +
            '<div class="mtrans">&#x1F1E8;&#x1F1F3; ' + escHtml(parsed.cn) + '</div>';
  } else {
    var flag = parsed.dir === 'id-jp'  ? '&#x1F1EF;&#x1F1F5;' :
               parsed.dir === 'id-cn'  ? '&#x1F1E8;&#x1F1F3;' : '&#x1F1EE;&#x1F1E9;';
    body += '<div class="mtrans">' + flag + ' ' + escHtml(parsed.translated) + '</div>';
  }
  return body;
}

function addMessage(original, parsed, srcLang) {
  var log = ge('log');
  var empty = ge('empty-state');
  if (empty) empty.remove();
  var now = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  var div = document.createElement('div');
  div.className = 'msg s' + srcLang;
  div.innerHTML = buildMsgHtml(original, parsed, srcLang, now, false);
  // Prepend - newest on top
  log.insertBefore(div, log.firstChild);
  log.scrollTop = 0;
  // Save
  transcript.push({ time: now, original: original, result: parsed, srcLang: srcLang });
  saveHistory();
}

function addMessageFromHistory(entry) {
  var log = ge('log');
  var empty = ge('empty-state');
  if (empty) empty.remove();
  var div = document.createElement('div');
  div.className = 'msg s' + entry.srcLang;
  div.innerHTML = buildMsgHtml(entry.original, entry.result, entry.srcLang, entry.time, true);
  // History appended (older messages at bottom)
  log.appendChild(div);
}

// -- HISTORY -----------------------------------------------
function saveHistory() {
  try {
    localStorage.setItem('ihist', JSON.stringify(transcript.slice(-200)));
  } catch(e) {}
}

function loadHistory() {
  try {
    var saved = localStorage.getItem('ihist');
    if (!saved) return;
    var entries = JSON.parse(saved);
    if (!entries || !entries.length) return;
    entries.forEach(function(e) {
      if (!e.time || !e.original || !e.result || !e.srcLang) return;
      transcript.push(e);
      addMessageFromHistory(e);
    });
    if (entries.length) dbg('loaded ' + entries.length + ' history entries', 'ok');
  } catch(e) { dbg('history load err: ' + e.message, 'err'); }
}

function exportTranscript() {
  if (!transcript.length) { toast('Belum ada percakapan untuk diexport', 'warn'); return; }
  var txt = 'TRANSCRIPT LIVE INTERPRETER - Andono Imagine 2026\n';
  txt += new Date().toLocaleString('id-ID') + '\n';
  txt += '='.repeat(40) + '\n\n';
  transcript.forEach(function(e) {
    var who = e.srcLang === 'id' ? 'KAMU (ID)' : e.srcLang === 'jp' ? 'LAWAN (JP)' : 'LAWAN (CN)';
    txt += '[' + e.time + '] ' + who + '\n';
    txt += '  Asli: ' + e.original + '\n';
    if (e.result.dir === 'id-both') {
      txt += '  JP: ' + e.result.jp + '\n';
      txt += '  CN: ' + e.result.cn + '\n';
    } else {
      txt += '  Terjemahan: ' + e.result.translated + '\n';
    }
    txt += '\n';
  });
  var blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'transcript_' + new Date().toISOString().slice(0, 10) + '.txt';
  a.click();
  URL.revokeObjectURL(url);
  toast('Transcript diexport', 'ok');
}

function clearLog() {
  ge('log').innerHTML = '<div class="emp-state" id="empty-state"><div class="emp-icon">&#x1F3A4;</div><div class="emp-txt">Mode A: timer bergantian otomatis<br>Mode B: tap untuk pilih giliran</div></div>';
  transcript.length = 0;
  localStorage.removeItem('ihist');
  toast('Log dikosongkan', '', 1500);
}

// -- STATS -------------------------------------------------
function startSessionTimer() {
  S.sessionStart = Date.now();
  sessInt = setInterval(function() {
    var sec = Math.floor((Date.now() - S.sessionStart) / 1000);
    var el = ge('stat-session');
    if (el) el.textContent = String(Math.floor(sec/60)).padStart(2,'0') + ':' + String(sec%60).padStart(2,'0');
  }, 1000);
}

function stopSessionTimer() {
  clearInterval(sessInt); sessInt = null;
}

function resetStats() {
  S.sentences = 0;
  localStorage.setItem('icount', '0');
  var el = ge('stat-session');
  if (el) el.textContent = '00:00';
  if (S.running) S.sessionStart = Date.now();
  updateStats();
  toast('Statistik di-reset', '', 1500);
}

// -- VU METER + VAD ----------------------------------------
function setupVUMeter(stream) {
  cancelAnimationFrame(vuRAF);
  if (audioCtx) { try { audioCtx.close(); } catch(x) {} }
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  var src = audioCtx.createMediaStreamSource(stream);
  var an = audioCtx.createAnalyser();
  an.fftSize = 256; an.smoothingTimeConstant = 0.7;
  src.connect(an);
  var data = new Uint8Array(an.frequencyBinCount);
  vadOn = false; vadSilStart = 0;

  function tick() {
    if (!S.running || !an) return;
    an.getByteFrequencyData(data);
    var vs = Math.floor(300  / (audioCtx.sampleRate / an.fftSize));
    var ve = Math.floor(3400 / (audioCtx.sampleRate / an.fftSize));
    var sum = 0;
    for (var i = vs; i < ve; i++) sum += data[i];
    var avg = sum / (ve - vs);
    var level = Math.min(7, Math.floor(avg / 8));
    for (var j = 1; j <= 7; j++) {
      var b = ge('vu' + j);
      if (!b) continue;
      if (j <= level) { b.classList.add('on'); b.style.height = (3 + j * 2.5) + 'px'; }
      else            { b.classList.remove('on'); b.style.height = '3px'; }
    }
    var dot = ge('dot');
    if (dot) dot.style.transform = (level >= 2 && dot.classList.contains('lis')) ? 'scale(1.4)' : 'scale(1)';
    // VAD
    var isVoice = avg > VAD_THR;
    if (isVoice) {
      if (!vadOn) {
        vadOn = true;
        var lt = ge('live-txt');
        if (lt && (lt.classList.contains('emp') || lt.textContent === 'Mendengarkan...')) {
          setLiveText('🎙 Suara terdeteksi...', 'par');
        }
      }
      vadSilStart = 0;
    } else {
      if (vadOn) {
        if (!vadSilStart) vadSilStart = Date.now();
        else if (Date.now() - vadSilStart > VAD_SIL) {
          vadOn = false; vadSilStart = 0;
          if (lastPartial && lastPartial.length >= 2 && !S.speaking) {
            dbg('VAD force: ' + lastPartial, 'warn');
            var vt = lastPartial; lastPartial = '';
            clearTimeout(silenceTmr);
            setLiveText(vt, 'fin');
            pending = vt;
            clearTimeout(pendingTmr);
            triggerFinal();
          }
        }
      }
    }
    vuRAF = requestAnimationFrame(tick);
  }
  tick();
}

function startAndroidVU() {
  stopAndroidVU();
  var tick = 0;
  avuInt = setInterval(function() {
    if (!S.running) { stopAndroidVU(); return; }
    tick++;
    for (var i = 1; i <= 7; i++) {
      var b = ge('vu' + i);
      if (!b) continue;
      b.style.height = (3 + Math.abs(Math.sin((tick + i * 2) * 0.3)) * 8) + 'px';
      b.classList.add('on');
    }
  }, 150);
}

function stopAndroidVU() {
  if (avuInt) { clearInterval(avuInt); avuInt = null; }
}

function resetVUBars() {
  for (var i = 1; i <= 7; i++) {
    var b = ge('vu' + i);
    if (b) { b.classList.remove('on'); b.style.height = '3px'; }
  }
  var dot = ge('dot');
  if (dot) dot.style.transform = 'scale(1)';
  stopAndroidVU();
}

function cleanupAudio() {
  cancelAnimationFrame(vuRAF);
  stopAndroidVU();
  if (audioStream) { audioStream.getTracks().forEach(function(t) { t.stop(); }); audioStream = null; }
  if (audioCtx) { try { audioCtx.close(); } catch(x) {} audioCtx = null; }
}

}
