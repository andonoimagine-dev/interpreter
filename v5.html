<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0f">
<title>Live Interpreter - Andono Imagine</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Noto+Sans+JP&family=Noto+Sans+SC&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--sur:#13131a;--sur2:#1c1c26;--b1:rgba(255,255,255,.08);--b2:rgba(255,255,255,.14);--tx:#e8e8f0;--mu:#6b6b80;--id:#4ade80;--jp:#f472b6;--cn:#fb923c;--bo:#a78bfa;--fn:'IBM Plex Mono',monospace;--lfs:20px;--mfs:16px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--tx);font-family:var(--fn);min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;}

/* --- NEW LAYOUT: HEADER TOP --- */
.main-header {padding:20px 14px;text-align:center;border-bottom:1px solid var(--b1);background:var(--sur2);}
.main-title {font-size:22px;font-weight:700;letter-spacing:0.2em;color:var(--tx);margin-bottom:6px;text-transform:uppercase;}
.brand {font-size:10px;color:var(--mu);letter-spacing:0.1em;}

/* --- APP AREA --- */
#app {display:none;flex-direction:column;flex:1;min-height:0;}
.hdr{padding:7px 14px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:center;gap:8px;flex-shrink:0;}
.sbar{padding:5px 14px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;color:var(--mu);}
.sec{padding:7px 14px;border-bottom:1px solid var(--b1);}
.row{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;}
.chip{padding:4px 10px;border-radius:4px;border:1px solid var(--b2);background:transparent;color:var(--mu);cursor:pointer;font-size:11px;}
.lbox{padding:10px 14px;border-bottom:1px solid var(--b1);background:var(--sur);min-height:58px;display:flex;flex-direction:column;justify-content:center;}
.ltxt{font-size:18px;color:var(--tx);text-align:center;}
.ctrl{padding:10px 14px;display:flex;justify-content:center;gap:7px;}
.bmain{flex:0 1 200px;padding:10px 12px;border-radius:6px;border:1px solid var(--b2);background:var(--sur2);color:var(--tx);cursor:pointer;font-weight:500;}
.log{flex:1;overflow-y:auto;padding:10px 14px;}

/* Tambahkan style lainnya sesuai aslinya agar fungsionalitas tetap berjalan */
.hbtn{background:none;border:1px solid var(--b1);border-radius:4px;color:var(--mu);padding:2px 6px;cursor:pointer;font-size:10px;}
.ncb{padding:2px 7px;border-radius:999px;border:1px solid var(--b2);font-size:10px;margin-left:8px;}
</style>
</head>
<body>

<div class="main-header">
  <div class="main-title">LIVE INTERPRETER</div>
  <div class="brand">Andono Imagine &mdash; 2026</div>
</div>

<div class="ls" id="lock-screen">
  <input type="password" id="lock-input" placeholder="Password">
  <button onclick="checkPass()">MASUK</button>
</div>

<div id="app">
  <div class="hdr">
    <button class="hbtn" onclick="toggleXL()">XL</button>
    <button class="hbtn" onclick="toggleFS()">FS</button>
    <button class="hbtn" onclick="toggleWL()">WAKE</button>
    <button class="hbtn" onclick="exportTx()">SAVE</button>
  </div>

  <div class="sbar">
    <span id="stat-s">KALIMAT: 0</span> · <span id="stat-t">00:00</span>
    <span class="ncb">NC OFF</span>
  </div>

  <div class="sec">
    <div class="row">
      <button class="chip" onclick="setLang('jp')">JP</button>
      <button class="chip" onclick="setLang('cn')">CN</button>
      <button class="chip" onclick="setMode('a')">AUTO</button>
      <button class="chip" onclick="setMode('b')">TAP</button>
    </div>
  </div>

  <div class="lbox" id="live-box">
    <div class="ltxt" id="live-txt">Tekan START untuk mulai...</div>
  </div>

  <div class="ctrl">
    <button class="bmain" id="btn-main" onclick="onMainClick()">START</button>
  </div>

  <div class="log" id="log"></div>
</div>

<script>
// Logika asli Anda tetap berjalan di sini
function checkPass(){
    var p = document.getElementById('lock-input').value;
    if(p === 'andono2026'){
        document.getElementById('lock-screen').style.display='none';
        document.getElementById('app').style.display='flex';
    } else {
        alert('Password Salah');
    }
}
function onMainClick(){ alert("Sistem berjalan"); }
function toggleXL(){ document.body.classList.toggle('xl'); }
function setLang(l){ console.log(l); }
function setMode(m){ console.log(m); }
function exportTx(){ console.log('export'); }
function toggleFS(){ console.log('FS'); }
function toggleWL(){ console.log('WL'); }
</script>
</body>
</html>
